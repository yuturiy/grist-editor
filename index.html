<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Markdown WYSIWYG для Grist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #editor { height: 100%; }
    /* курсор-"рука" для посилань у WYSIWYG */
    .toastui-editor-ww-container a { cursor: pointer; }
    #msg {
      display: none; padding: 24px; font: 14px/1.5 sans-serif; color: #666;
    }
  </style>
</head>
<body>
  <div id="msg"></div>
  <div id="editor"></div>

<script>
(function () {
  // ---------- Налаштування ----------
  const COLUMN = 'Content';
  const SAVE_DELAY_MS = 600;
  const SAFE_URL = /^(https?:\/\/|mailto:|tel:)/i;
  const BARE_URL = /^https?:\/\/\S+$/i;

  // ---------- Стан ----------
  let editor = null;
  let currentId = null;
  let lastSaved = '';
  let saveTimer = null;
  let applyingRemote = false;

  // ---------- Ініціалізація редактора ----------
  function createEditor() {
    editor = new toastui.Editor({
      el: document.getElementById('editor'),
      height: '100%',
      initialEditType: 'wysiwyg',
      previewStyle: 'tab',
      hideModeSwitch: false,
      usageStatistics: false,
      extendedAutolinks: true,
      linkAttributes: { target: '_blank', rel: 'noopener noreferrer' },
      toolbarItems: [
        ['heading', 'bold', 'italic', 'strike'],
        ['hr', 'quote'],
        ['ul', 'ol', 'task', 'indent', 'outdent'],
        ['table', 'link'],
        ['code', 'codeblock']
      ],
      events: {
        change: onEditorChange,
        blur: flushSave
      }
    });

    const root = document.getElementById('editor');

    root.addEventListener('click', function (e) {
      const a = e.target.closest && e.target.closest('.toastui-editor-ww-container a');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!SAFE_URL.test(href)) return;
      e.preventDefault();
      window.open(href, '_blank', 'noopener,noreferrer');
    });

    root.addEventListener('paste', function (e) {
      if (!editor.isWysiwygMode()) return;
      if (!e.target.closest || !e.target.closest('.toastui-editor-ww-container')) return;

      const cd = e.clipboardData;
      if (!cd) return;
      const text = (cd.getData('text/plain') || '').trim();
      const html = cd.getData('text/html') || '';
      if (!BARE_URL.test(text) || /<a\s/i.test(html)) return;

      e.preventDefault();
      e.stopPropagation();
      editor.exec('addLink', { linkUrl: text, linkText: text });
    }, true);
  }

  // ---------- Збереження ----------
  function onEditorChange() {
    if (applyingRemote || currentId === null) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, SAVE_DELAY_MS);
  }

  async function flushSave() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!editor || currentId === null) return;
    const md = editor.getMarkdown();
    if (md === lastSaved) return;
    const previousSaved = lastSaved;
    lastSaved = md;
    try {
      const fields = grist.mapColumnNamesBack({ [COLUMN]: md });
      await grist.selectedTable.update({ id: currentId, fields });
      showMessage('');
    } catch (err) {
      if (lastSaved === md) lastSaved = previousSaved;
      console.error('Не вдалося зберегти:', err);
      showMessage('Помилка збереження: ' + err.message, true);
    }
  }

  // ---------- Допоміжне ----------
  function showMessage(text, keepEditorVisible = false) {
    const m = document.getElementById('msg');
    m.textContent = text;
    m.style.display = text ? 'block' : 'none';
    document.getElementById('editor').style.display = text && !keepEditorVisible ? 'none' : 'block';
  }

  function setContent(value) {
    applyingRemote = true;
    editor.setMarkdown(value || '', false);
    applyingRemote = false;
  }

  // ---------- Інтеграція з Grist ----------
  grist.ready({
    requiredAccess: 'full',
    columns: [{ name: COLUMN, title: 'Markdown-текст', type: 'Text' }]
  });

  grist.onRecord(async function (record, mapped) {
    if (!editor) createEditor();

    if (currentId !== null && (record === null || record.id !== currentId)) {
      await flushSave();
    }

    if (!record) {
      currentId = null;
      showMessage('Немає вибраного запису.');
      return;
    }
    if (!mapped) {
      currentId = null;
      showMessage('Вкажіть колонку в налаштуваннях віджета (Visible columns → Markdown-текст).');
      return;
    }

    showMessage('');
    const incoming = mapped[COLUMN] == null ? '' : String(mapped[COLUMN]);
    const sameRecord = record.id === currentId;
    currentId = record.id;

    if (sameRecord && incoming === editor.getMarkdown()) {
      lastSaved = incoming;
      return;
    }
    lastSaved = incoming;
    setContent(incoming);
  });

  window.addEventListener('beforeunload', flushSave);
})();
</script>
</body>
</html>
